name: Action CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test Action - Analyze Mode
        uses: ./
        with:
          path: '.'
          action: 'analyze'

      - name: Test Action - Validate Mode
        uses: ./
        with:
          path: '.'
          action: 'validate'

      - name: Test Action - Package Mode
        uses: ./
        with:
          path: '.'
          action: 'package'
          output-dir: 'action-dist'

      - name: Verify Packaged Artifact
        run: |
          test -f action-dist/*.zip
          unzip -t action-dist/*.zip
