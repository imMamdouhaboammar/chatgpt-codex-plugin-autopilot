name: 'ChatGPT & Codex Plugin Autopilot'
description: 'Discover agentic workflows, validate plugin contracts, and package deterministic ChatGPT/Codex plugins.'
author: 'Mamdouh Aboammar'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  path:
    description: 'Path to repository or plugin directory'
    required: false
    default: '.'
  action:
    description: 'Operation to perform: auto | analyze | validate | package | build-directory-pack'
    required: false
    default: 'auto'
  output-dir:
    description: 'Output directory for packaged release artifacts'
    required: false
    default: 'dist'
  fail-on-error:
    description: 'Fail the step if validation errors are encountered'
    required: false
    default: 'true'
  summary:
    description: 'Generate markdown summary in GitHub Step Summary'
    required: false
    default: 'true'
  create-pr:
    description: 'Automatically open a Pull Request with scaffolded plugin structure after analysis'
    required: false
    default: 'false'
  pr-title:
    description: 'Custom title for the auto-created Pull Request'
    required: false
    default: '🤖 [Plugin Autopilot] Scaffold ChatGPT/Codex plugin structure'
  pr-branch:
    description: 'Custom branch name for the auto-created Pull Request (leave empty for auto-generated)'
    required: false
    default: ''

outputs:
  ok:
    description: 'True if operation succeeded without errors'
    value: ${{ steps.autopilot.outputs.ok }}
  architecture:
    description: 'Detected or declared architecture (skills-only, mcp-backed, hybrid)'
    value: ${{ steps.autopilot.outputs.architecture }}
  skills-count:
    description: 'Number of detected or validated skills'
    value: ${{ steps.autopilot.outputs.skills_count }}
  plugin-path:
    description: 'Path to the built ZIP archive (if packaged)'
    value: ${{ steps.autopilot.outputs.plugin_path }}
  sha256:
    description: 'SHA-256 digest of the built ZIP archive (if packaged)'
    value: ${{ steps.autopilot.outputs.sha256 }}
  pr-url:
    description: 'URL of the automatically opened Pull Request (if create-pr is true)'
    value: ${{ steps.autopilot.outputs.pr_url }}
  pr-number:
    description: 'Number of the automatically opened Pull Request (if create-pr is true)'
    value: ${{ steps.autopilot.outputs.pr_number }}

runs:
  using: 'composite'
  steps:
    - id: autopilot
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_CREATE_PR: ${{ inputs.create-pr }}
        INPUT_PR_TITLE: ${{ inputs.pr-title }}
        INPUT_PR_BRANCH: ${{ inputs.pr-branch }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 "${ACTION_PATH}/scripts/action_entrypoint.py"
